[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fast-minimum-variance"
version = "0.7.0"
description = "Constructing minimum variance portfolios"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
authors = [
    {name = "Thomas Schmelzer", email = "thomas.s@yukkalab.com"},
]
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.0",
    "cvxpy>=1.1",
    "clarabel>=0.11.0",
    "osqp>=1.1.1",
    "cvx-linalg",
]

[project.urls]
Homepage = "https://github.com/Jebel-Quant/fast_minimum_variance"
Repository = "https://github.com/Jebel-Quant/fast_minimum_variance"

#[project.optional-dependencies]
#convex = [
#    "cvxpy>=1.0",
#    "clarabel>=0.11.0",
#    "osqp>=1.1.1",
#]

[dependency-groups]
lint = []
test = [
    "pytest>=8.0",
]
dev = [
    "marimo>=0.20.0",
    "matplotlib>=3.10.9",
    "pandas>=3.0",
    "pyarrow>=24.0.0",
    "requests>=2.0",
    "yfinance>=0.2"
]

[tool.hatch.build.targets.wheel]
packages = ["src/fast_minimum_variance"]

[tool.deptry]
optional_dependencies_dev_groups = ["dev"]

[tool.deptry.package_module_name_map]
numpy = "numpy"
polars = "polars"
scipy = "scipy"
marimo = "marimo"
cvxpy = "cvxpy"
pandas = "pandas"
pyarrow = "pyarrow"
clarabel = "clarabel"
osqp = "osqp"
"cvx-linalg" = "cvx"
