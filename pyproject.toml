[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fast-minimum-variance"
version = "0.7.2"
description = "Constructing minimum variance portfolios"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
authors = [
    {name = "Thomas Schmelzer", email = "thomas.schmelzer@gmail.com"},
]
dependencies = [
    "numpy>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/Jebel-Quant/fast_minimum_variance"
Repository = "https://github.com/Jebel-Quant/fast_minimum_variance"

[dependency-groups]
lint = []
test = [
    "pytest>=8.0",
    "scipy>=1.14",  # independent SLSQP oracle in the test suite (not a runtime dependency)
]
dev = [
    "matplotlib>=3.10.9",
    "pandas>=3.0",
    "pyarrow>=24.0.0",
    "requests>=2.0",
    "yfinance>=0.2"
]

[tool.hatch.build.targets.wheel]
packages = ["src/fast_minimum_variance"]

[tool.mypy]
# Strict mode is supplied on the CLI by the Rhiza `typecheck` target
# (`mypy --strict`). These overrides only relax checks for third-party
# scientific libraries that ship no type stubs / py.typed marker, so their
# imports don't drown out real type errors in our own code.
[[tool.mypy.overrides]]
module = [
    "scipy.*",
]
ignore_missing_imports = true

[tool.deptry]
optional_dependencies_dev_groups = ["dev"]

[tool.deptry.package_module_name_map]
numpy = "numpy"
polars = "polars"
scipy = "scipy"
"scikit-learn" = "sklearn"
pandas = "pandas"
pyarrow = "pyarrow"
